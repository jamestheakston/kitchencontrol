<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8faf9;--card:#fff;--line:#e7e5e4;--text:#1c1917;--mute:#78716c;--soft:#f5f5f4;--accent:#80b48c;--accent2:#6c9d77;--ok-bg:#ecfdf5;--ok:#047857;--warn:#f59e0b;--bad:#e11d48;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--card:#1c211e;--line:#2d3430;--text:#f2f4f3;--mute:#9aa39d;--soft:#262c28;--ok-bg:#12281c;--ok:#6ee7b7}}
:root[data-theme="dark"]{--bg:#121513;--card:#1c211e;--line:#2d3430;--text:#f2f4f3;--mute:#9aa39d;--soft:#262c28;--ok-bg:#12281c;--ok:#6ee7b7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.8rem}
#date{color:var(--mute);font-weight:500;margin-top:2px}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#clock{font-size:1.8rem;font-weight:300;background:var(--card);border:1px solid var(--line);padding:6px 16px;border-radius:16px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.card h2{margin:0 0 14px;font-size:1.05rem;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 span.l{display:flex;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 14px;background:var(--soft);color:var(--text);font-weight:600;transition:transform .1s,background .15s}
button:active{transform:scale(.97)}
button.pri{background:var(--accent);color:#fff}button.pri:hover{background:var(--accent2)}
button.warn{background:var(--warn);color:#fff}button.bad{background:var(--bad);color:#fff}
.ib{padding:8px 12px;font-size:.85rem}
input,select{font:inherit;background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.fix{flex:none}
.mt{margin-top:12px}
canvas{display:block;margin:0 auto;max-width:100%}
.meals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border:1px solid var(--line);background:var(--soft);border-radius:16px}
.meal small{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.meal.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.meal.done small{color:var(--ok)}
#tdisp{font-size:3.4rem;font-weight:300;text-align:center;margin:6px 0 12px;font-variant-numeric:tabular-nums}
#tdisp.low{color:var(--bad)}
.bar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.mute{color:var(--mute);font-size:.75rem;text-align:center;margin-top:8px}
ul{list-style:none;margin:12px 0 0;padding:0;max-height:260px;overflow-y:auto}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;margin-bottom:6px;background:var(--soft);border-radius:14px;cursor:pointer}
li.c span{text-decoration:line-through;color:var(--mute)}
li button{background:none;padding:2px 8px;color:var(--mute)}
.pill{font-size:.7rem;background:var(--soft);padding:3px 10px;border-radius:99px;color:var(--mute)}
#ring{position:fixed;inset:0;z-index:99;background:#e11d48;color:#fff;display:none;flex-direction:column;gap:16px;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;animation:p 1s infinite}
#ring.on{display:flex}
.al{background:rgba(255,255,255,.16);border-radius:28px;padding:28px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}
.al b{font-size:clamp(1.8rem,6vw,3.6rem);font-weight:700}
.al button,#ring>button{background:#fff;color:#111;font-size:1.2rem;padding:16px}
@media(orientation:landscape){#ring{flex-direction:row;align-items:stretch}#ring>button{display:none}}
@keyframes p{50%{background:#be123c}}
#sleep{position:fixed;inset:0;z-index:90;background:#000;display:none;align-items:flex-end;justify-content:center;color:#333;padding:24px}
#sleep.on{display:flex}
#snd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:50;background:var(--accent);color:#fff;border-radius:16px;padding:14px;text-align:center;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header>
  <div><h1>Kitchen Command</h1><div id="date"></div></div>
  <div class="hr">
    <button class="ib" id="wl" title="Keep screen on">🔆 Screen on</button>
    <button class="ib" id="fs">⛶ Full</button>
    <button class="ib" id="zz">🌙 Sleep screen</button>
    <button class="ib" id="th">🌓 Auto</button>
    <div id="clock">00:00:00</div>
  </div>
</header>

<main class="grid">
  <section class="card">
    <canvas id="ac" width="180" height="180" style="width:180px;height:180px"></canvas>
    <div class="mt">
      <h2><span class="l">🍽️ Tonight's dinner</span></h2>
      <input id="dinner" placeholder="What's for dinner?" style="width:100%">
    </div>
  </section>

  <section class="card">
    <h2><span class="l">🐕 Dog Tracker</span><button class="ib" id="dr">Reset</button></h2>
    <div class="meals">
      <button class="meal" data-k="b"><small>Breakfast</small><b>Not fed</b></button>
      <button class="meal" data-k="d"><small>Dinner</small><b>Not fed</b></button>
      <button class="meal" data-k="w"><small>Walk</small><b>Not yet</b></button>
      <button class="meal" data-k="h"><small>Water</small><b>Not yet</b></button>
    </div>
    <div class="row mt" style="align-items:center">
      <span style="flex:1">🦴 Treats today: <b id="tc">0</b></span>
      <button class="fix" id="tm">−</button><button class="fix pri" id="tp">+</button>
    </div>
    <div class="mute">Tap a tile to mark done, tap again to undo</div>
  </section>

  <section class="card">
    <h2><span class="l">⏱️ Kitchen Timer</span></h2>
    <div id="tdisp">00:00</div>
    <div class="bar"><i id="tbar"></i></div>
    <div class="row">
      <button data-add="1">+1</button><button data-add="5">+5</button><button data-add="10">+10</button><button data-add="30">+30</button>
    </div>
    <div class="row mt">
      <select id="pre"><option value="">Presets…</option><option value="3">Soft egg · 3m</option><option value="7">Hard egg · 7m</option><option value="8">Pasta · 8m</option><option value="12">Rice · 12m</option><option value="15">Tea steep · 5m→15m</option><option value="25">Roast veg · 25m</option></select>
    </div>
    <div class="row mt">
      <button class="pri" id="ts">Start</button><button class="fix" id="tr">Reset</button>
    </div>
  </section>

  <section class="card">
    <h2><span class="l">🔔 Alarm</span></h2>
    <div class="row">
      <input type="time" id="at"><button class="fix" id="ab">Set</button>
    </div>
    <div class="mute" id="as">No active alarm</div>
  </section>

  <section class="card">
    <h2><span class="l">🛒 Shopping List</span><span class="pill" id="sc">0 items</span></h2>
    <div class="row"><input id="si" placeholder="Add item…"><button class="fix pri" id="sa">＋</button></div>
    <ul id="sl"></ul>
    <div class="row mt"><button class="ib" id="scc">Clear checked</button><button class="ib" id="scp">Copy list</button></div>
  </section>

  <section class="card">
    <h2><span class="l">⚖️ Converter</span></h2>
    <div class="row"><input id="cv" type="number" inputmode="decimal" placeholder="Amount"><select id="cu"></select></div>
    <div id="co" style="font-size:1.6rem;font-weight:300;text-align:center;margin-top:14px">—</div>
  </section>
</main>

<div id="ring"></div>
<div id="sleep">Tap anywhere to wake</div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const two=n=>String(n).padStart(2,'0');
const dayKey=d=>d.toDateString();

/* ---------- Audio + ringing ---------- */
let ac=null,ringTimer=null,alerts=[],alertId=0,beepEl=null,unlocked=false;
function makeWav(){const sr=8000,n=sr,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++){const t=i/sr,ph=t%.35,env=ph<.25?Math.min(1,ph*80)*Math.min(1,(.25-ph)*80):0;v.setInt16(44+i*2,Math.sin(6.283*880*t)*env*16000,true)}return 'data:audio/wav;base64,'+btoa(String.fromCharCode(...new Uint8Array(b)))}
try{beepEl=new Audio(makeWav());beepEl.preload='auto'}catch(e){}
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}return ac}
['click','touchend'].forEach(ev=>document.addEventListener(ev,()=>{audio();if(!unlocked&&beepEl){try{const p=beepEl.play();if(p&&p.then)p.then(()=>{beepEl.pause();beepEl.currentTime=0;unlocked=true}).catch(()=>{});else{beepEl.pause();unlocked=true}}catch(e){}}},{passive:true}));
function webBeep(){const c=audio();if(!c)return;for(let i=0;i<3;i++){const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.35;o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}}
function beep(){if(!beepEl)return webBeep();try{beepEl.currentTime=0;const p=beepEl.play();if(p&&p.catch)p.catch(webBeep)}catch(e){webBeep()}}
function ring(msg,snooze){alerts.push({id:++alertId,msg,snooze});drawAlerts();if(!ringTimer){beep();ringTimer=setInterval(beep,2500)}if(navigator.vibrate)navigator.vibrate([300,150,300])}
function dismiss(id){alerts=alerts.filter(a=>a.id!==id);drawAlerts()}
function dismissWhere(f){alerts=alerts.filter(a=>!f(a));drawAlerts()}
function drawAlerts(){
  const r=$('ring');r.textContent='';
  if(!alerts.length){r.classList.remove('on');clearInterval(ringTimer);ringTimer=null;return}
  r.classList.add('on');
  alerts.forEach(a=>{
    const c=document.createElement('div');c.className='al';
    const b=document.createElement('b');b.textContent=a.msg;
    const row=document.createElement('div');row.className='row';
    const sn=document.createElement('button');sn.textContent='Snooze 5m';sn.onclick=()=>{dismiss(a.id);if(a.snooze)a.snooze()};
    const d=document.createElement('button');d.textContent='Dismiss';d.onclick=()=>dismiss(a.id);
    row.append(sn,d);c.append(b,row);r.appendChild(c);
  });
  if(alerts.length>1){const all=document.createElement('button');all.textContent='Dismiss all';all.onclick=()=>dismissWhere(()=>true);r.appendChild(all)}
}


/* ---------- Clocks ---------- */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawClock(now){
  const cv=$('ac'),dpr=window.devicePixelRatio||1;
  if(cv.width!==180*dpr){cv.width=180*dpr;cv.height=180*dpr}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,180,180);
  x.translate(90,90);
  x.beginPath();x.arc(0,0,82,0,6.283);x.fillStyle=css('--bg');x.fill();x.lineWidth=3;x.strokeStyle=css('--line');x.stroke();
  for(let i=0;i<12;i++){const a=i*Math.PI/6;x.beginPath();x.arc(Math.sin(a)*68,-Math.cos(a)*68,i%3?2:3.5,0,6.283);x.fillStyle=css('--mute');x.fill()}
  const h=now.getHours()%12,m=now.getMinutes(),s=now.getSeconds()+now.getMilliseconds()/1000;
  const hand=(a,l,w,c)=>{x.beginPath();x.lineWidth=w;x.lineCap='round';x.strokeStyle=c;x.moveTo(0,0);x.lineTo(Math.sin(a)*l,-Math.cos(a)*l);x.stroke()};
  hand((h+m/60)*Math.PI/6,40,4,css('--text'));
  hand((m+s/60)*Math.PI/30,58,3,css('--text'));
  hand(s*Math.PI/30,66,1.5,css('--accent'));
  x.beginPath();x.arc(0,0,4,0,6.283);x.fillStyle=css('--accent');x.fill();
}

/* ---------- Dog tracker ---------- */
let dog=store.get('dog',{});
const dogLabels={b:['Breakfast','Not fed'],d:['Dinner','Not fed'],w:['Walk','Not yet'],h:['Water','Not yet']};
function dogCheck(){const t=dayKey(new Date());if(dog.date!==t){dog={date:t,b:'',d:'',w:'',h:'',t:0};store.set('dog',dog)}}
function dogUI(){
  document.querySelectorAll('.meal').forEach(el=>{const k=el.dataset.k,v=dog[k];el.classList.toggle('done',!!v);el.querySelector('b').textContent=v?'✓ '+v:dogLabels[k][1]});
  $('tc').textContent=dog.t||0;
}
document.querySelectorAll('.meal').forEach(el=>el.onclick=()=>{dogCheck();const k=el.dataset.k;dog[k]=dog[k]?'':new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});store.set('dog',dog);dogUI()});
$('tp').onclick=()=>{dogCheck();dog.t=(dog.t||0)+1;store.set('dog',dog);dogUI()};
$('tm').onclick=()=>{dogCheck();dog.t=Math.max(0,(dog.t||0)-1);store.set('dog',dog);dogUI()};
$('dr').onclick=()=>{dog={date:dayKey(new Date()),b:'',d:'',w:'',h:'',t:0};store.set('dog',dog);dogUI()};

/* ---------- Timer (timestamp based, survives reloads/throttling) ---------- */
let T=store.get('timer',{end:0,left:0,total:0}); // end>0 => running
function tLeft(){return T.end?Math.max(0,Math.ceil((T.end-Date.now())/1000)):T.left}
function tRender(){
  const s=tLeft(),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  $('tdisp').textContent=(h?h+':'+two(m):two(m))+':'+two(s%60);
  $('tdisp').classList.toggle('low',T.end>0&&s<=10);
  $('tbar').style.width=(T.total?100*s/T.total:0)+'%';
  $('ts').textContent=T.end?'Pause':'Start';
  $('ts').className=T.end?'warn':'pri';
}
function tAdd(min){const left=tLeft()+min*60;T.total+=min*60;if(T.end)T.end=Date.now()+left*1000;else T.left=left;if(!T.total)T.total=left;store.set('timer',T);tRender()}
$('ts').onclick=()=>{audio();if(T.end){T.left=tLeft();T.end=0}else if(T.left>0){T.end=Date.now()+T.left*1000;if(!T.total)T.total=T.left}store.set('timer',T);tRender()};
$('tr').onclick=()=>{T={end:0,left:0,total:0};store.set('timer',T);dismissWhere(a=>a.msg.startsWith('⏱️'));tRender()};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>tAdd(+b.dataset.add));
$('pre').onchange=e=>{const v=+e.target.value;if(v){T={end:0,left:v*60,total:v*60};store.set('timer',T);tRender()}e.target.value=''};
function tTick(){if(T.end&&Date.now()>=T.end){T={end:0,left:0,total:0};store.set('timer',T);ring('⏱️ Timer finished!',()=>{T={end:Date.now()+300000,left:0,total:300};store.set('timer',T)});}tRender()}

/* ---------- Alarm ---------- */
let A=store.get('alarm',{time:'',on:false,fired:''});
function aRender(){$('at').value=A.time;$('ab').textContent=A.on?'Clear':'Set';$('ab').className='fix '+(A.on?'bad':'');$('as').textContent=A.on?'Alarm set for '+A.time:'No active alarm'}
$('ab').onclick=()=>{audio();if(A.on){A.on=false}else if($('at').value){A={time:$('at').value,on:true,fired:''}}store.set('alarm',A);aRender()};
function aTick(now){
  if(!A.on)return;const cur=two(now.getHours())+':'+two(now.getMinutes()),key=dayKey(now)+cur;
  if(cur===A.time&&A.fired!==key){A.fired=key;store.set('alarm',A);ring('🔔 Alarm '+A.time,()=>{const d=new Date(Date.now()+300000);A={time:two(d.getHours())+':'+two(d.getMinutes()),on:true,fired:''};store.set('alarm',A);aRender()})}
}

/* ---------- Shopping ---------- */
let shop=store.get('shop',[]);
function sRender(){
  const ul=$('sl');ul.textContent='';
  shop.forEach((it,i)=>{
    const li=document.createElement('li');if(it.c)li.className='c';
    const sp=document.createElement('span');sp.textContent=(it.c?'☑ ':'☐ ')+it.t;
    const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Remove');
    li.onclick=()=>{shop[i].c=!shop[i].c;sSave()};
    x.onclick=e=>{e.stopPropagation();shop.splice(i,1);sSave()};
    li.append(sp,x);ul.appendChild(li);
  });
  $('sc').textContent=shop.length+(shop.length===1?' item':' items');
}
function sSave(){store.set('shop',shop);sRender()}
function sAdd(){const v=$('si').value.trim();if(v){shop.push({t:v,c:false});$('si').value='';sSave()}}
$('sa').onclick=sAdd;$('si').onkeydown=e=>{if(e.key==='Enter')sAdd()};
$('scc').onclick=()=>{shop=shop.filter(i=>!i.c);sSave()};
$('scp').onclick=async()=>{const txt=shop.filter(i=>!i.c).map(i=>'• '+i.t).join('\n');try{await navigator.clipboard.writeText(txt);$('scp').textContent='Copied ✓'}catch(e){$('scp').textContent='Copy failed'}setTimeout(()=>$('scp').textContent='Copy list',1500)};

/* ---------- Dinner + converter ---------- */
$('dinner').value=store.get('dinner','');$('dinner').oninput=e=>store.set('dinner',e.target.value);
const conv=[['cups → ml',v=>v*240,'ml'],['ml → cups',v=>v/240,'cups'],['tbsp → ml',v=>v*15,'ml'],['tsp → ml',v=>v*5,'ml'],['oz → g',v=>v*28.35,'g'],['g → oz',v=>v/28.35,'oz'],['lb → kg',v=>v*.4536,'kg'],['kg → lb',v=>v/.4536,'lb'],['°F → °C',v=>(v-32)*5/9,'°C'],['°C → °F',v=>v*9/5+32,'°F']];
conv.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c[0];$('cu').appendChild(o)});
function cRun(){const v=parseFloat($('cv').value);const c=conv[$('cu').value];$('co').textContent=isNaN(v)?'—':(Math.round(c[1](v)*100)/100)+' '+c[2]}
$('cv').oninput=cRun;$('cu').onchange=cRun;

/* ---------- Theme, fullscreen, wake lock ---------- */
const modes=['auto','light','dark'];let mode=store.get('theme','auto');
function applyTheme(){if(mode==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=mode;$('th').textContent='🌓 '+mode[0].toUpperCase()+mode.slice(1)}
$('th').onclick=()=>{mode=modes[(modes.indexOf(mode)+1)%3];store.set('theme',mode);applyTheme()};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
let lock=null,wantLock=store.get('wl',false);
async function getLock(){try{if('wakeLock' in navigator){lock=await navigator.wakeLock.request('screen');lock.onrelease=()=>{lock=null}}}catch(e){}$('wl').style.outline=wantLock?'2px solid var(--accent)':'none'}
$('wl').onclick=async()=>{wantLock=!wantLock;store.set('wl',wantLock);if(wantLock)await getLock();else{try{lock&&lock.release()}catch(e){}$('wl').style.outline='none'}};
document.addEventListener('visibilitychange',()=>{if(wantLock&&!document.hidden&&!lock)getLock()});

/* ---------- Main loop ---------- */
function tick(){
  const now=new Date();
  $('clock').textContent=now.toLocaleTimeString();
  $('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});
  aTick(now);tTick();
  const before=dog.date;dogCheck();if(dog.date!==before)dogUI();
}
$('zz').onclick=()=>$('sleep').classList.add('on');$('sleep').onclick=()=>$('sleep').classList.remove('on');
applyTheme();aRender();sRender();cRun();dogCheck();dogUI();tRender();if(wantLock)getLock();
setInterval(tick,250);tick();
(function frame(){drawClock(new Date());requestAnimationFrame(frame)})();
</script>
</body>
</html>
